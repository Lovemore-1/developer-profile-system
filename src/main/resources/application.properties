spring.application.name=devprofile
server.port=${PORT:8080}

# File-based H2: a single database file next to the app. Zero setup, and
# unlike the in-memory default, data survives an app restart.
spring.datasource.url=jdbc:h2:file:./data/devprofile
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Left at the Spring Boot default (true): the public profile page reads
# profile.getProjects() - a lazily-loaded collection - while Thymeleaf is
# rendering, which happens *after* the controller method returns. With
# open-in-view=false that collection load fails because the DB session is
# already closed by then (LazyInitializationException -> 500). True keeps
# the session open through rendering, which is what earlier caused the
# public profile page to throw a 500 the moment it tried to list projects.
spring.jpa.open-in-view=true

spring.jpa.properties.jakarta.persistence.validation.mode=none

server.error.whitelabel.enabled=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.provider.google.user-name-attribute=email
