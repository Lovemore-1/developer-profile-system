<!-- Shared site header. Included on every public-facing page via th:replace,
     so the brand mark and nav only exist in one file. Not used inside
     /admin - that has its own nav since it's a different context
     (logged-in tool, not marketing/public page). -->
<header th:fragment="site-header" class="site-header">
    <a href="/" class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5L2 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 5L22 12L16 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>DevProfile</span>
    </a>
    <nav>
        <a th:href="@{/login}">Log in</a>
        <a th:href="@{/register}" class="btn btn-primary btn-small">Create Profile</a>
    </nav>
</header>
