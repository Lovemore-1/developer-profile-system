<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>
<div class="auth-box">
    <h1>Log in</h1>
    <p th:if="${param.registered}" class="success-banner">Account created — log in below.</p>
    <p th:if="${param.error}" class="error-banner">Incorrect email or password.</p>
    <!--
      The name="username" attribute below is not a mistake even though the
      label says "Email address" - Spring Security's default login filter
      looks for a request parameter literally called "username" (see
      SecurityConfig's formLogin()). Renaming this to "email" would need
      form.usernameParameter("email") added there too. Changing the label
      that a human reads is enough to fix the actual complaint (people
      typing junk instead of a real email); the parameter name underneath
      is just internal plumbing.
    -->
    <form th:action="@{/login}" method="post">
        <label for="username">Email address</label>
        <input type="email" id="username" name="username">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="hint">No account yet? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
