<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>
<div class="auth-box">
    <h1>Log in</h1>
    <p th:if="${param.registered}" class="success-banner">Account created — log in below.</p>
    <p th:if="${param.error}" class="error-banner">Incorrect email or password.</p>

    <a th:href="@{/oauth2/authorization/google}" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
    </a>

    <div class="auth-divider"><span>or</span></div>

    <form th:action="@{/login}" method="post">
        <!--
          name="username" is not a mistake even though the label says
          "Email address" - Spring Security's default login filter looks
          for a request parameter literally called "username" (see
          SecurityConfig's formLogin()). type="text" (not type="email")
          is deliberate too: this field also has to accept existing
          non-email-formatted logins like the seeded admin account, so it
          can't enforce browser-level email format checking the way the
          registration page does.
        -->
        <label for="username">Email address</label>
        <input type="text" id="username" name="username">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="hint">No account yet? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
