<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>
<div class="auth-box">
    <h1>Create your account</h1>
    <p th:if="${usernameTaken}" class="error-banner">An account with that email already exists.</p>
    <form th:action="@{/register}" th:object="${registrationForm}" method="post">
        <label for="username">Email address</label>
        <input type="email" id="username" th:field="*{username}" placeholder="you@example.com">
        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="hint">Already have an account? <a th:href="@{/login}">Log in</a></p>
</div>
</body>
</html>
