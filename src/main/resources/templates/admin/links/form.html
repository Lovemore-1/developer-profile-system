<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Link</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></aside>
    <div class="admin-shell">
    <main>
        <h1 th:text="${link.id} != null ? 'Edit link' : 'Add link'"></h1>

        <form th:action="${link.id} != null ? @{'/admin/links/' + ${link.id}} : @{/admin/links}"
              th:object="${link}" method="post">
            <input type="hidden" th:field="*{id}">

            <label for="label">Label</label>
            <input type="text" id="label" th:field="*{label}" placeholder="e.g. GitHub, LinkedIn, Portfolio">
            <p class="field-error" th:if="${#fields.hasErrors('label')}" th:errors="*{label}"></p>

            <label for="url">URL</label>
            <input type="text" id="url" th:field="*{url}" placeholder="https://...">
            <p class="field-error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></p>

            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </main>
    </div>
</div>
</body>
</html>
