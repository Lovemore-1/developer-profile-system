<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Experience</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></aside>
    <div class="admin-shell">
    <main>
        <h1 th:text="${experience.id} != null ? 'Edit experience' : 'Add experience'"></h1>

        <form th:action="${experience.id} != null ? @{'/admin/experience/' + ${experience.id}} : @{/admin/experience}"
              th:object="${experience}" method="post">
            <input type="hidden" th:field="*{id}">

            <label for="jobTitle">Job title</label>
            <input type="text" id="jobTitle" th:field="*{jobTitle}">
            <p class="field-error" th:if="${#fields.hasErrors('jobTitle')}" th:errors="*{jobTitle}"></p>

            <label for="company">Company</label>
            <input type="text" id="company" th:field="*{company}">
            <p class="field-error" th:if="${#fields.hasErrors('company')}" th:errors="*{company}"></p>

            <label for="location">Location</label>
            <input type="text" id="location" th:field="*{location}">

            <label for="startDate">Start date</label>
            <input type="date" id="startDate" th:field="*{startDate}">
            <p class="field-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p>

            <label for="endDate">End date</label>
            <input type="date" id="endDate" th:field="*{endDate}">

            <label class="checkbox-label">
                <input type="checkbox" th:field="*{current}"> I currently work here
            </label>

            <label for="description">Description</label>
            <textarea id="description" rows="4" th:field="*{description}"></textarea>

            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </main>
    </div>
</div>
</body>
</html>
