<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Experience</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></aside>
    <div class="admin-shell">
    <main>
        <h1>Experience</h1>
        <p th:if="${success}" class="success-banner" th:text="${success}"></p>
        <a class="btn btn-primary" th:href="@{/admin/experience/new}">Add experience</a>

        <table class="admin-table">
            <tr th:each="item : ${items}">
                <td>
                    <strong th:text="${item.jobTitle}"></strong><br>
                    <span th:text="${item.company}"></span>
                </td>
                <td th:text="${item.startDate} + ' - ' + (${item.current} ? 'Present' : (${item.endDate} ?: ''))"></td>
                <td>
                    <a th:href="@{'/admin/experience/' + ${item.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/admin/experience/' + ${item.id} + '/delete'}" method="post" class="inline-form">
                        <button type="submit" class="link-button" onclick="return confirm('Delete this entry?')">Delete</button>
                    </form>
                </td>
            </tr>
        </table>
        <p th:if="${items.isEmpty()}">No experience added yet.</p>
    </main>
    </div>
</div>
</body>
</html>
