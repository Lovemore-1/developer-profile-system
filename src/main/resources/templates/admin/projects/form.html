<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Project</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></aside>
    <div class="admin-shell">
    <main>
        <h1 th:text="${project.id} != null ? 'Edit project' : 'Add project'"></h1>

        <form th:action="${project.id} != null ? @{'/admin/projects/' + ${project.id}} : @{/admin/projects}"
              th:object="${project}" method="post">
            <input type="hidden" th:field="*{id}">

            <label for="name">Project name</label>
            <input type="text" id="name" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="description">Description</label>
            <textarea id="description" rows="4" th:field="*{description}"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

            <label for="techStack">Tech stack</label>
            <input type="text" id="techStack" th:field="*{techStack}" placeholder="React, Spring Boot, ...">

            <label for="repoUrl">Repo URL</label>
            <input type="text" id="repoUrl" th:field="*{repoUrl}">

            <label for="liveUrl">Live URL</label>
            <input type="text" id="liveUrl" th:field="*{liveUrl}">

            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </main>
    </div>
</div>
</body>
</html>
