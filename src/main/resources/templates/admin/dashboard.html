<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage your profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <nav class="admin-nav">
        <span class="brand">Admin</span>
        <a th:href="@{/admin}">Profile</a>
        <a th:href="@{/admin/projects}">Projects</a>
        <a th:href="@{'/u/' + ${profile.owner.username}}" target="_blank">View public page</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="link-button">Log out</button>
        </form>
    </nav>

    <main>
        <h1>Your profile</h1>
        <p th:if="${success}" class="success-banner" th:text="${success}"></p>

        <form th:action="@{/admin/profile}" th:object="${profile}" method="post">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}">
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

            <label for="headline">Headline</label>
            <input type="text" id="headline" th:field="*{headline}">
            <p class="field-error" th:if="${#fields.hasErrors('headline')}" th:errors="*{headline}"></p>

            <label for="summary">Summary</label>
            <textarea id="summary" rows="4" th:field="*{summary}"></textarea>

            <label for="contactEmail">Contact email</label>
            <input type="text" id="contactEmail" th:field="*{contactEmail}">
            <p class="field-error" th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}"></p>

            <label for="contactPhone">Contact phone</label>
            <input type="text" id="contactPhone" th:field="*{contactPhone}">

            <label for="location">Location</label>
            <input type="text" id="location" th:field="*{location}">

            <label for="cvUrl">CV link (Google Drive, GitHub, etc.)</label>
            <input type="text" id="cvUrl" th:field="*{cvUrl}" placeholder="https://...">

            <button type="submit" class="btn btn-primary">Save profile</button>
        </form>
    </main>
</div>
</body>
</html>
